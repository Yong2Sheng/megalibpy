default_install_hook_types: [pre-push]
default_stages: [pre-push]

repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: ruff check
        language: system
        types: [python]
      - id: pytest-smoke
        name: pytest smoke tests
        entry: python -m pytest -q -m smoke
        language: system
        pass_filenames: false
        always_run: true
