name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      docs_preview:
        description: Publish an explicitly selected PR documentation preview
        type: boolean
        default: false
      preview_pr:
        description: Open PR number matching this branch and commit
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOCS_PREVIEW_PR: ${{ inputs.preview_pr }}
    defaults:
      run:
        shell: micromamba-shell {0}

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Create Conda environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Install megalibpy in editable mode
        run: python -m pip install -e . --no-deps --no-build-isolation

      - name: Lint with Ruff
        run: ruff check .

      - name: Run tests with coverage
        run: |
          python -m pytest --cov=megalibpy \
            --cov-report=term-missing --cov-report=xml --cov-report=html

      - name: Build documentation
        run: |
          if [[ "${{ inputs.docs_preview }}" == "true" ]]; then
            python docs/build.py docs/_build/html --title "megalibpy - PR ${DOCS_PREVIEW_PR} preview (unmerged)"
          else
            python docs/build.py docs/_build/html
          fi

      - name: Smoke-test the installed wheel
        run: |
          set -e
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/wheels"
          python -m pip install --no-deps --target "$RUNNER_TEMP/wheel-install" "$RUNNER_TEMP"/wheels/megalibpy-*.whl
          PYTHONPATH="$RUNNER_TEMP/wheel-install" python -m pytest -q -m smoke

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error
          retention-days: 7

      - name: Upload documentation preview
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: docs/_build/html/
          if-no-files-found: error
          retention-days: 7

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html/

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v6
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: coverage.xml
          fail_ci_if_error: true

  deploy-docs:
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-docs-preview:
    # Explicit maintainer dispatch only; PR events cannot publish this preview.
    if: github.event_name == 'workflow_dispatch' && inputs.docs_preview && startsWith(github.ref, 'refs/heads/codex/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}previews/pr-${{ steps.preview.outputs.number }}/
    defaults:
      run:
        shell: micromamba-shell {0}
    steps:
      - name: Validate the explicitly selected preview PR
        id: preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_PR: ${{ inputs.preview_pr }}
          PREVIEW_SHA: ${{ github.sha }}
          PREVIEW_BRANCH: ${{ github.ref_name }}
          PREVIEW_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          import re
          import subprocess
          number = os.environ["PREVIEW_PR"]
          if not re.fullmatch(r"[1-9][0-9]*", number):
              raise SystemExit("preview_pr must be a positive PR number")
          repo = os.environ["PREVIEW_REPOSITORY"]
          pr = json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}/pulls/{number}"]))
          if (pr["state"] != "open" or pr["base"]["ref"] != "develop"
                  or pr["head"]["repo"]["full_name"] != repo
                  or pr["head"]["ref"] != os.environ["PREVIEW_BRANCH"]
                  or pr["head"]["sha"] != os.environ["PREVIEW_SHA"]):
              raise SystemExit("Preview must match an open develop PR in this repository at this exact commit")
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write(f"number={number}\n")
          PYCODE
      # Build the regular site from develop, never from the unmerged feature.
      - name: Check out published development source
        uses: actions/checkout@v6
        with:
          ref: develop
          persist-credentials: false

      - name: Create development documentation environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Build regular documentation from develop
        run: |
          python -m pip install -e . --no-deps --no-build-isolation
          if [[ -f docs/build.py ]]; then
            python docs/build.py _site
          else
            sphinx-build -W -b html docs _site
          fi

      - name: Download checked PR documentation
        uses: actions/download-artifact@v8
        with:
          name: documentation
          path: _site/previews/pr-${{ steps.preview.outputs.number }}/

      - name: Mark the preview and record its source
        env:
          PREVIEW_SHA: ${{ github.sha }}
          PREVIEW_NUMBER: ${{ steps.preview.outputs.number }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          number = os.environ["PREVIEW_NUMBER"]
          root = Path(f"_site/previews/pr-{number}")
          revision = os.environ["PREVIEW_SHA"]
          notice = (
              '<div class="admonition warning" role="note">'
              f'<p class="admonition-title">PR #{number} documentation preview - unmerged</p>'
              f'<p>Source commit: <code>{revision}</code>. '
              'This preview does not mean native MEGAlib integration has passed. '
              f'<a href="https://github.com/Yong2Sheng/megalibpy/pull/{number}">View PR #{number}</a>.'
              '</p></div>'
          )
          anchor = '<div itemprop="articleBody">'
          for path in root.rglob("*.html"):
              text = path.read_text()
              if anchor in text:
                  path.write_text(text.replace(anchor, anchor + notice, 1))
          (root / "source-commit.txt").write_text(revision + "\n")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload regular site and isolated preview
        uses: actions/upload-pages-artifact@v5
        with:
          # A failed-job rerun must not leave two equally named candidates.
          name: github-pages-preview-${{ github.run_attempt }}
          path: _site/

      - name: Deploy documentation preview
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          artifact_name: github-pages-preview-${{ github.run_attempt }}

      # The artifact service can briefly omit a successfully uploaded artifact.
      # Retry deployment against the same artifact, without uploading it again.
      - name: Wait for preview artifact metadata after deployment failure
        if: steps.deployment.outcome == 'failure'
        shell: bash
        run: sleep 10

      - name: Retry documentation preview deployment
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-preview-${{ github.run_attempt }}
